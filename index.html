<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="&Aacute;lvaro Fern&aacute;ndez Barrero">
        <meta name="description" content="Application for post-its (academic purposes)">

        <link rel="icon" type="image/png" href="./favicon.png">
        <link rel="stylesheet" href="./src/styles/main.css">

        <script defer type="module" src="./src/scripts/main.js"></script>
        
        <title>My Post-Its</title>
    </head>

    <body>
        <header>
            <h1>My Post-Its</h1>
        </header>

        <div id="colors-container"></div>
        <img id="new-post-it-button" src="./src/img/plus.svg">

        <main>
            <div id="board">

            </div>

            <div id="login">
                <h2>Login</h2>
                <div id="login-by-email-and-password-container">
                    <div class="login-input">
                        <label for="email-input">E-mail:</label>
                        <input required type="email" placeholder="email@domain.com" id="email-input">
                    </div>
    
                    <div class="login-input">
                        <label for="password-input">Password:</label>
                        <input required type="password" id="password-input">
                    </div>
    
                    <p id="login-by-email-and-password-button" class="input-login-button" title="Log in">Log in by email and password</p>
                </div>

                <div id="login-with-services-container">
                    <p class="login-with-service input-login-button" title="Log in">Log in using Google</p>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; Project created for academic purposes by <a title="Github" href="https://www.github.com/ZaneDevv">&Aacute;lvaro Fern&aacute;ndez</a></p>
            <p>The project is open-source and the scripts can be seen in <a title="Github repository" href="https://github.com/ZaneDevv/MyPost-Its">this repository</a>.</p>
        </footer>
    </body>
</html>
